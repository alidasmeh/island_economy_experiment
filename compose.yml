version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/mydatabase
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    volumes:
      - ./backend:/app
    networks:
      - frontend-backend
      - database
    restart: always
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend-prod:
    profiles:
      - prod
    build:
      context: ./frontend
      target: production
    ports:
      - 8080:80
    networks:
      - frontend-backend
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file: .env
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - REACT_APP_BACKEND_SOCKET_URL=localhost:8000
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: curl --fail http://localhost:8080 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s

  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    networks:
      - frontend-backend
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    env_file: .env

  dashboard-prod:
    profiles:
      - prod
    build:
      context: ./dashboard
      target: production
    ports:
      - 8080:80
    networks:
      - frontend-backend
    depends_on:
      - backend
    volumes:
      - ./dashboard:/usr/src/app
      - /usr/src/app/node_modules
    env_file: .env
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: curl --fail http://localhost:8080 || exit 1
      interval: 60s
      retries: 5
      start_period: 20s
      timeout: 10s

  dashboard-dev:
    profiles:
      - dev
    build:
      context: ./dashboard
      target: development
    ports:
      - "3001:3001"
    networks:
      - frontend-backend
    depends_on:
      - backend
    volumes:
      - ./dashboard:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
      - NODE_ENV=development
      - PORT=3001

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - database

volumes:
  postgres_data:

networks:
  database:
  frontend-backend:
