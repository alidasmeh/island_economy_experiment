# Island Economy — default parameters (human-only study).
# Every numeric value used by the game lives here; do not hard-code any of them in the code.
# q, rho, gamma, gamma_pot and d were calibrated in Milestone 2 so the dilemma check passes
# (docs/simulation/README.md). The original spec values are in spec_original.yaml.

group:
  n_players: 4                 # N
  rounds_min: 15               # T is drawn per group, uniform integer in [rounds_min, rounds_max]
  rounds_max: 20               # never shown to participants
  effort_points: 10            # E

endowments:
  wealth_min: 50               # w_i0 ~ uniform integer [wealth_min, wealth_max]
  wealth_max: 200
  skill_min: 0.8               # theta_i ~ uniform [skill_min, skill_max]
  skill_max: 1.2

resource:
  carrying_capacity: 100       # K
  initial_stock_fraction: 0.7  # S_0 = fraction * K
  regrowth_rate: 0.4           # r
  collapse_fraction: 0.1       # S_min = fraction * K; below it regrowth is 0
  catchability: 0.017          # q   calibrated M2 (spec 0.01)
  price: 1.0                   # base price per fish

infrastructure:
  initial: 1.0                 # A_0
  gain_per_point: 0.005        # gamma   calibrated M2 (spec 0.02)
  depreciation: 0.05           # d   calibrated M2 (spec 0.02)
  gain_per_pot_coin: 0.005     # gamma_pot   calibrated M2 (spec 0.02; kept equal to gamma)
  match_cost_per_point: 1.0    # coins drawn from the pot per matched contribution point (match_rate * e_c)

saving:
  return_per_point: 0.3        # rho   calibrated M2 (spec 1.0)
  interest_rate: 0.02          # i

insurance:
  premium: 2.0                 # coins taken from every player each round while insurance is on
  refund_pool_at_end: true     # leftover pool returned equally at game end

# Events: one is drawn per round. Probabilities must sum to 1.
# harvest_mult multiplies harvest yield, regrowth_mult the regrowth term,
# price_mult the price; insurance_payout marks rounds on which the pool pays out.
events:
  - {name: calm,        probability: 0.55, harvest_mult: 1.0, regrowth_mult: 1.0, price_mult: 1.0, insurance_payout: false}
  - {name: storm,       probability: 0.15, harvest_mult: 0.8, regrowth_mult: 1.0, price_mult: 1.0, insurance_payout: true}
  - {name: good_season, probability: 0.15, harvest_mult: 1.0, regrowth_mult: 1.3, price_mult: 1.0, insurance_payout: false}
  - {name: price_drop,  probability: 0.15, harvest_mult: 1.0, regrowth_mult: 1.0, price_mult: 0.8, insurance_payout: false}

# Allowed coordinator lever ranges (section 6). Server-side validation uses these.
levers:
  quota:        {min: 0,   max: 30}          # fish per player; 0 = no quota
  tax_rate:     {min: 0.0, max: 0.5, step: 0.05}
  match_rate:   {min: 0.0, max: 1.0, step: 0.05}
  fine:         {min: 0,   max: 50}          # coins per unit over quota
  audit_prob:   {min: 0.0, max: 0.5, step: 0.05}
  redistribution_options: [equal, need, contribution, infrastructure]
  info_policy_options: [show_individual, totals_only]
  announcement_max_chars: 200

# Policy in force when no coordinator exists (condition `none`) and at round 1
# before the coordinator acts: all levers at zero/off.
default_policy:
  quota: 0
  tax_rate: 0.0
  redistribution: equal
  match_rate: 0.0
  fine: 0
  audit_prob: 0.0
  insurance: false
  info_policy: show_individual
  announcement: ""

bribery:
  detection_prob: 0.1          # p_detect per accepted bribe
  fine: 20                     # F_bribe paid by each side on detection

coordinator_pay:
  welfare_bonus_rate: 0.01     # coordinator bonus = rate * total final group payoff (coins)
  bribe_income_rate: 0.5       # coordinator bribe income = rate * accepted bribe amount (coins)
  bribe_income_cap: 50         # max bribe income (coins) per game; offers beyond it cannot be accepted

decision:
  timeout_default_allocation: {harvest: 4, contribute: 3, save: 3}   # round-1 timeout allocation

# Computer players (section 9). Used only for dropout replacement, practice rounds
# and headless simulation — never presented as participants.
bots:
  cooperative: {harvest: 2, contribute: 6, save: 2}    # low harvest, high contribution
  selfish:     {harvest: 10, contribute: 0, save: 0}   # maximum harvest, zero contribution
  conditional_first_round: {harvest: 4, contribute: 3, save: 3}  # before any group average exists
  random_transfer_prob: 0.0    # chance a `random` bot also sends a transfer
  # Simulated coordinator stub default (`--condition coordinator_stub` without --policy):
  stub_policy:
    quota: 5
    tax_rate: 0.2
    redistribution: equal
    match_rate: 0.5
    fine: 10
    audit_prob: 0.3
    insurance: true
    info_policy: show_individual
    announcement: "Scripted test policy."

payment:
  coins_per_currency_unit: 100 # e.g. 100 coins = 1 GBP
  currency: GBP
  show_up_fee: 1.50
